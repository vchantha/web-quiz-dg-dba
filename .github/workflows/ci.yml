name: Validate Quiz Platform
on:
  push:
    branches: [main, feature/full-quiz-platform]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dba_quiz
          POSTGRES_USER: dba_quiz
          POSTGRES_PASSWORD: testing-only-db-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dba_quiz -d dba_quiz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: CI-test-key-with-more-than-fifty-random-characters-do-not-reuse
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: dba_quiz
      POSTGRES_USER: dba_quiz
      POSTGRES_PASSWORD: testing-only-db-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_quiz
      - run: python manage.py test --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Boot full application
        run: docker compose up -d --wait --wait-timeout 150
      - name: Smoke test API behind Nginx
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health | grep '"status": "ok"'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/auth/session | grep '"authenticated": false'
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose down
